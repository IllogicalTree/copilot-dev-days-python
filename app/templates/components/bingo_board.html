<div class="grid grid-cols-5 gap-1 w-full max-w-md mx-auto aspect-square">
    {% for square in session.board %}
    {% set is_winning = square.id in session.winning_square_ids %}
    {% set tilt_class = "tilt-" ~ ((loop.index0 % 5) + 1) %}
    <button
        {% if not square.is_free_space %}
        hx-post="/toggle/{{ square.id }}"
        hx-target="#game-container"
        hx-swap="outerHTML"
        {% endif %}
        {% if square.is_free_space %}disabled{% endif %}
        class="bingo-square board-square-{{ loop.index0 }} relative flex items-center justify-center p-1 text-center rounded select-none min-h-[60px]
        {%- if square.is_marked %}
            {%- if is_winning %} is-marked is-winning
            {%- else %} is-marked
            {%- endif %}
        {%- endif %}
        {%- if square.is_free_space %} is-free{% endif %}
        {{ tilt_class }}"
        aria-pressed="{{ 'true' if square.is_marked else 'false' }}"
        aria-label="{{ 'Free space' if square.is_free_space else square.text }}">
        <span class="wrap-break-word hyphens-auto leading-tight">{{ square.text }}</span>
        {% if square.is_marked and not square.is_free_space %}
        <span class="absolute top-0.5 right-0.5 text-green-600 text-xs">✓</span>
        {% endif %}
    </button>
    {% endfor %}
</div>
