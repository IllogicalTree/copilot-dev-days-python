<div id="game-container">
<div class="game-wrapper">
    <!-- Header -->
    <header class="game-header">
        <button
            hx-post="/reset"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="back-btn">
            ← BACK
        </button>
        <h1 class="game-title">SOC OPS</h1>
        <div class="header-spacer"></div>
    </header>

    <!-- Instructions -->
    <p class="game-instructions">
        TAP A SQUARE WHEN YOU FIND SOMEONE WHO MATCHES IT
    </p>

    <!-- Bingo indicator -->
    {% if session.has_bingo %}
    <div class="bingo-indicator">
        ★ BINGO! YOU GOT A LINE! ★
    </div>
    {% endif %}

    <!-- Board -->
    <div class="board-area">
        {% include "components/bingo_board.html" %}
    </div>
</div>

{% if session.show_bingo_modal %}
    {% include "components/bingo_modal.html" %}
{% endif %}
</div>
