<div id="game-container">
<div class="flex flex-col min-h-full bg-gray-50">
    <!-- Header -->
    <header class="chaos-header flex items-center justify-between p-3">
        <button
            hx-post="/reset"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="chaos-back-btn px-3 py-1.5">
            ← BAIL
        </button>
        <h1 class="chaos-game-title">CHAOS BINGO</h1>
        <div class="w-16"></div>
    </header>

    <!-- Instructions -->
    <p class="chaos-instructions text-center py-2 px-4">
        🎯 Hunt humans • 💥 Smash squares • 🏆 Win chaos
    </p>

    <!-- Bingo indicator -->
    {% if session.has_bingo %}
    <div class="chaos-bingo-alert text-center py-2 font-semibold">
        ⚡ BINGO!! YOU MAGNIFICENT CHAOS AGENT!! ⚡
    </div>
    {% endif %}

    <!-- Board -->
    <div class="flex-1 flex items-center justify-center p-3">
        {% include "components/bingo_board.html" %}
    </div>
</div>

{% if session.show_bingo_modal %}
    {% include "components/bingo_modal.html" %}
{% endif %}
</div>
