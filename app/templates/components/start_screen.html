<div id="game-container">
<div class="landing-hero">
    <div class="landing-glow"></div>
    <div class="landing-grid-bg"></div>

    <div class="landing-content">
        <!-- Brand -->
        <div class="landing-brand">
            <span class="brand-icon">🎯</span>
            <h1 class="landing-title">Soc<span class="brand-accent">Ops</span></h1>
            <p class="landing-tagline">Social Bingo — Make every meeting legendary</p>
        </div>

        <!-- How to play card -->
        <div class="landing-card">
            <p class="card-label">How to play</p>
            <ol class="card-steps">
                <li>
                    <span class="step-num">01</span>
                    <span>Find people who match the questions on your board</span>
                </li>
                <li>
                    <span class="step-num">02</span>
                    <span>Tap a square when you find a matching person</span>
                </li>
                <li>
                    <span class="step-num">03</span>
                    <span>Get 5 in a row — horizontally, vertically, or diagonally — to win!</span>
                </li>
            </ol>
        </div>

        <!-- CTA -->
        <button
            hx-post="/start"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="landing-cta">
            <span>Start Game</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>

        <p class="landing-footer">5 × 5 grid · First to get a line wins</p>
    </div>
</div>
</div>
