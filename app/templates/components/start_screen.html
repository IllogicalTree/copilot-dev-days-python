<div id="game-container">
<div class="flex flex-col items-center justify-center min-h-full p-6 bg-gray-50">
    <div class="text-center max-w-sm">
        <div style="margin-bottom: 0.5rem; font-size: 3rem; animation: float 2s ease-in-out infinite; display: inline-block;">🌀</div>
        <h1 class="chaos-title" style="font-size: 3.5rem; color: var(--neon-pink); margin-bottom: 0; display: block;">CHAOS</h1>
        <h1 class="chaos-title" style="font-size: 3.5rem; color: var(--neon-yellow); margin-bottom: 0.25rem; display: block;">BINGO</h1>
        <p style="font-family: 'Nunito', sans-serif; font-size: 0.85rem; color: var(--neon-cyan); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 2rem; opacity: 0.9;">Social Chaos Edition 💥</p>

        <div class="chaos-howto rounded-xl p-6 mb-8 chaos-card-enter">
            <h2 style="font-family: 'Bangers', cursive; font-size: 1.4rem; letter-spacing: 3px; color: var(--neon-yellow); margin-bottom: 0.75rem; text-transform: uppercase;">⚡ How to SURVIVE ⚡</h2>
            <ul style="font-family: 'Nunito', sans-serif; text-align: left; font-size: 0.85rem; color: var(--text-main); list-style: none; padding: 0; margin: 0;">
                <li style="margin-bottom: 0.5rem;">🔥 Hunt down humans who match the chaos</li>
                <li style="margin-bottom: 0.5rem;">💥 Smash a square when you find one</li>
                <li>🏆 Get 5 in a row and UNLEASH CHAOS!</li>
            </ul>
        </div>

        <button
            hx-post="/start"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="w-full chaos-btn text-white font-bold py-4 px-8 rounded-lg">
            🚀 UNLEASH THE CHAOS 🚀
        </button>
    </div>
</div>
</div>
