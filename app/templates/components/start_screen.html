<div id="game-container">
<div class="flex flex-col items-center justify-center min-h-full p-6 bg-gray-50">
    <div class="text-center max-w-sm">
        <div class="chaos-emoji-bounce">🌀</div>
        <h1 class="chaos-title chaos-title-primary">CHAOS</h1>
        <h1 class="chaos-title chaos-title-secondary">BINGO</h1>
        <p class="chaos-subtitle">Social Chaos Edition 💥</p>

        <div class="chaos-howto rounded-xl p-6 mb-8 chaos-card-enter">

            <ul class="chaos-howto-list">
                <li class="chaos-howto-item">🔥 Hunt down humans who match the chaos</li>

        <button

            hx-target="#game-container"

            🚀 UNLEASH THE CHAOS 🚀
