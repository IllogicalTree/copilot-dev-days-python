<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ff0090">
    <meta name="description" content="Social Bingo - Find people who match the questions!">
    <title>Soc Ops - Social Bingo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <script src="/static/js/htmx.min.js"></script>
</head>
<body>
    <!-- Animated background shapes - aria-hidden so screen readers ignore them -->
    <div class="bg-shapes" aria-hidden="true">
        <div class="shape shape-blob-1"></div>
        <div class="shape shape-blob-2"></div>
        <div class="shape shape-blob-3"></div>
        <div class="shape shape-diamond-1"></div>
        <div class="shape shape-diamond-2"></div>
        <div class="shape shape-ring-1"></div>
        <div class="shape shape-ring-2"></div>
        <div class="shape shape-tri"></div>
        <div class="shape shape-cross"></div>
        <div class="scanlines"></div>
    </div>
    <div id="app">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
